<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glamour | Dashboard Administrador</title>
    <link rel="stylesheet" href="/View/css/bootstrap.min.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/View/css/styles.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark shadow">
        <div class="container">
            <span class="navbar-brand fw-bold text-warning"><i class="fa-solid fa-scissors me-2"></i>Panel de Control</span>
            <a href="/View/html/index.html" class="btn btn-outline-light btn-sm">Cerrar Sesión</a>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white border-0 py-3">
                        <h5 class="mb-0 fw-bold"><i class="fa-solid fa-user-plus text-warning me-2"></i>Registrar Cliente</h5>
                    </div>
                    <div class="card-body">
                        <form id="formCliente">
                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Nombre Completo</label>
                                <input type="text" id="nombreCliente" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Teléfono</label>
                                <input type="tel" id="telCliente" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-warning w-100 fw-bold">Guardar Cliente</button>
                        </form>
                    </div>
                </div>

                <div class="card border-0 shadow-sm mt-4">
                    <div class="card-header bg-white border-0 py-3">
                        <h5 class="mb-0 fw-bold"><i class="fa-solid fa-calendar-check text-warning me-2"></i>Reservar Cita</h5>
                    </div>
                    <div class="card-body">
                        <form id="formCita">
                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Seleccionar Cliente</label>
                                <select id="selectCliente" class="form-select" required>
                                    <option value="">-- Buscar --</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Servicio</label>
                                <select id="servicioCita" class="form-select" required>
                                    <option value="Corte">Corte Stylist</option>
                                    <option value="Barba">Barbería</option>
                                    <option value="Tinte">Tinte / Color</option>
                                </select>
                            </div>
                            <div class="row g-2">
                                <div class="col-6">
                                    <label class="form-label small fw-bold text-muted">Fecha</label>
                                    <input type="date" id="fechaCita" class="form-control" required>
                                </div>
                                <div class="col-6">
                                    <label class="form-label small fw-bold text-muted">Hora</label>
                                    <input type="time" id="horaCita" class="form-control" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-dark w-100 fw-bold mt-3">Agendar Cita</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-header bg-white border-0 py-3 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fw-bold"><i class="fa-solid fa-list-ul text-warning me-2"></i>Agenda de Servicios</h5>
                        <span class="badge bg-dark" id="countCitas">0 Citas</span>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="bg-light">
                                    <tr>
                                        <th class="ps-3">Cliente</th>
                                        <th>Servicio</th>
                                        <th>Hora</th>
                                        <th>Estado</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaAgenda"></tbody>
                            </table>
                        </div>
                        <div id="noData" class="text-center py-5">
                            <p class="text-muted italic">No hay citas registradas aún.</p>
                        </div>
                    </div>
                </div>

                <!-- SECCIÓN DE HISTORIAL -->
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white border-0 py-3">
                        <h5 class="mb-0 fw-bold"><i class="fa-solid fa-history text-warning me-2"></i>Historial de Citas Completadas</h5>
                    </div>
                    <div class="card-body">
                        <!-- Filtros y búsqueda -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <input type="text" id="buscarHistorial" class="form-control" placeholder="Buscar por nombre de cliente...">
                            </div>
                            <div class="col-md-6">
                                <select id="ordenarHistorial" class="form-select">
                                    <option value="fecha-desc">Fecha (Más reciente primero)</option>
                                    <option value="fecha-asc">Fecha (Más antigua primero)</option>
                                    <option value="nombre-asc">Nombre (A-Z)</option>
                                    <option value="nombre-desc">Nombre (Z-A)</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="bg-light">
                                    <tr>
                                        <th class="ps-3">Cliente</th>
                                        <th>Servicio</th>
                                        <th>Fecha</th>
                                        <th>Hora</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaHistorial"></tbody>
                            </table>
                        </div>
                        <div id="noHistorialData" class="text-center py-4">
                            <p class="text-muted italic">No hay citas completadas en el historial.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    
    <script src="/Model/model.js"></script>
    <script src="/Controller/controller.js"></script>
    <script src="/View/js/app.js"></script>
</body>
</html>
